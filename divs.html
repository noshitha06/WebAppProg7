<!DOCTYPE html>

<html> <head> 
	<title>builds list
with divs</title>
	<style>
    .flex-container {
      display: flex;  flex-direction:row;
      background-color: red;
  }

.flex-container > div {  /*div children of the flex container*/
  background-color: #f1f1f1; 
  margin: 10px;  padding: 20px;  font-size: 30px;
}

/* Responsive layout */
@media (max-width: 600px) { 
	 .flex-container{
		 flex-direction:column;
		 background-color: green;
	  }
	}
</style></head>



<body>
	<h2>Noshitha builds list with divs</h2>
    <input type="text" id="itemInput">

	<div class="flex-container" id="target">
		  <div> 1</div>   
		  <div> 2</div>  
		  <div> 3</div>  
		</div>
	
</div>
	<p> Press the button to create an new element of type div and then add it to the container.
		</p>
		<button onclick="addEnd()">Add end</button>
	<script>
  function addEnd() {
  const newDiv = document.createElement("div");         
  const input = document.getElementById("itemInput");     
  newDiv.innerHTML = input.value;                         
  newDiv.className = "divlist";                            
  document.getElementById("container").appendChild(newDiv); 
}
</script>

</body>
<script>
	function makeNewDiv(){
		
		let element = document.createElement("div")
		element.innerHTML = "an item after 3"
		element.style.color = "orange"
		let container = document.getElementById('target')
		container.appendChild(element)
	}
</script>
</html>
