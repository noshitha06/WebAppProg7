<!DOCTYPE html >
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flower Game</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #eef7ea; }
    h1 { color: #2d6a4f; }

    .flex-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      background-color: #95d5b2;
    }
    .flex-container > div {
      background-color: #f1f1f1;
      margin: 10px;
      padding: 20px;
      font-size: 20px;
    }

    #field { margin-top: 20px; }
    .row { display: flex; justify-content: center; }
    .location { width: 80px; height: 80px; margin: 2px; cursor: pointer; }
    .location img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }

    @media (max-width: 600px) {
      .flex-container { flex-direction: column; background-color: #b7e4c7; }
      .location { width: 50px; height: 50px; }
    }
  </style>

</head>
<body>
  <h1>Noshitha finds avians</h1>

    <div>Click on the locations to find the flowers, watch out for the poison ivy</div>
    <div id="locations">Number of locations checked is zero.</div>
    <div id="score">Score is zero.</div>
    <div><button onclick="document.getElementById('help').textContent = help()">Click for help.</button></div>

  </div>

    <div class="row">

    </div>
    <div class="row">

      <div class="location"><img id="img8" src="TREE.jpg" alt="TREE" onclick="check(8)"></div>
      <div class="location"><img id="img9" src="TREE.jpg" alt="TREE" onclick="check(9)"></div>
      <div class="location"><img id="img10" src="TREE.jpg" alt="TREE" onclick="check(10)"></div>

    </div>

      <div class="location"><img id="img14" src="TREE.jpg" alt="TREE" onclick="check(14)"></div>
      <div class="location"><img id="img15" src="TREE.jpg" alt="TREE" onclick="check(15)"></div>
      <div class="location"><img id="img16" src="TREE.jpg" alt="TREE" onclick="check(16)"></div>
      <div class="location"><img id="img17" src="TREE.jpg" alt="TREE" onclick="check(17)"></div>

      <div class="location"><img id="img34" src="TREE.jpg" alt="TREE" onclick="check(34)"></div>
      <div class="location"><img id="img35" src="TREE.jpg" alt="TREE" onclick="check(35)"></div>
    </div>
  </div>

<script>
const ids = [];
for (let i = 0; i < 36; i++) ids.push("img" + i);

let score = 0;
let locationsVisited = 0;
let lastLocation = 0;
const poisonLocation = 19;
const roseLocation = 14;
const lilyLocations = [3, 25];
const daisyLocations = [2, 5, 11, 20, 21];
let gameOver = false;

function check(position) {
  if (gameOver) return;

  const img = document.getElementById(ids[position]);

  if (position === poisonLocation) {
    img.src = "poisonivy.jpg";
    img.alt = "poison ivy";
    img.onclick = null;
    score -= 4;
    gameOver = true;
  } else if (position === roseLocation) {
    img.src = "Rose.jpg";
    img.alt = "rose";
    img.onclick = null;
    score += 4;
  } else if (lilyLocations.includes(position)) {
    img.src = "Lily.jpg";
    img.alt = "lily";
    img.onclick = null;
    score += 2;
  } else if (daisyLocations.includes(position)) {
    img.src = "Daisy.jpg";
    img.alt = "daisy";
    img.onclick = null;
    score += 1;
  }

  locationsVisited++;
  lastLocation = position;

  document.getElementById("locations").textContent =
  "Number of locations checked is " + locationsVisited + ".";
  document.getElementById("score").textContent = "Score is " + score + ".";
}

function help() {
  const row = Math.floor(lastLocation / 6);
  const col = lastLocation % 6;
  const left  = row * 6 + (col + 5) % 6;
  const right = row * 6 + (col + 1) % 6;
  const up    = (lastLocation + 30) % 36;
  const down  = (lastLocation + 6) % 36;
  const four = [left, right, up, down];

  for (let i = 0; i < four.length; i++) {
    if (daisyLocations.includes(four[i])) {
      return "cold";
    }
  }

  const nine = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const r = row + dr;
      const c = col + dc;
      if (r >= 0 && r < 6 && c >= 0 && c < 6) {
        nine.push(r * 6 + c);
      }
    }
  }

  if (nine.includes(roseLocation)) {
    return "hot";
  }
  if (nine.includes(poisonLocation)) {
    return "watch out";
  }

  return "warm";

};
</script>

</html>
